# Adds HTTPS and the access token on top of docker-compose.yml (T-075, docs/deployment.md):
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
# Only Caddy is reachable from outside (ports 80 and 443). The app itself stays on the internal network and on
# 127.0.0.1 of the host, as in docker-compose.yml, so nobody can reach it without the proxy and the token.
services:
  app:
    environment:
      SPRING_PROFILES_ACTIVE: vps
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:?set APP_ACCESS_TOKEN in .env (at least 16 characters)}

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (the host name that points at this server)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
