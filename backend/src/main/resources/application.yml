spring:
  application:
    name: vacancy-tracker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vacancy_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:vacancy}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  task:
    scheduling:
      pool:
        size: 3
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  # The UI bundle is about 200 KB of JavaScript and 80 KB of CSS; gzip brings them to a third. JSON lists compress well too.
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json,application/problem+json,text/html,text/css,text/plain,application/javascript,text/javascript,image/svg+xml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Sources from the owner's list (T-089, docs/sources.md "Owner's list"). Each one was checked against its terms and
# robots.txt on the date recorded; a source that forbids automated reading is not here.
app:
  sources:
    rss:
      feeds:
        # Djinni publishes this feed on its job list ("Jobs feed in RSS"); its terms have no clause against reading it.
        # The feed accepts the list filters, for example ?primary_keyword=Java&employment=remote. It does not name the
        # company, so its vacancies show "Djinni" as the company.
        - id: djinni
          enabled: ${APP_SOURCES_DJINNI_ENABLED:true}
          url: ${APP_SOURCES_DJINNI_URL:https://djinni.co/jobs/rss/}
          terms-checked-on: "2026-11-02"
          terms-url: https://djinni.co/terms-of-use
          company-name: Djinni
