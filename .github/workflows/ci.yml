name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-sync:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PLAN.md and tasks.csv must agree
        run: bash scripts/check-plan-sync.sh

  backend:
    timeout-minutes: 20
    # Maven verify: unit and integration tests (Testcontainers needs Docker, which this runner has), Checkstyle,
    # the 80% line coverage gate for vacancy, collection and matching, and the architecture rules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Docker is available for Testcontainers
        run: |
          docker version
          docker info
      - name: Run backend verification
        run: mvn -B verify
        working-directory: backend
      - name: Keep the test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco*
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  smoke:
    timeout-minutes: 25
    # The Playwright smoke test (T-074): the packaged app with its UI, on an empty PostgreSQL, driven in a browser.
    # Pinned: ubuntu-latest is now 26.04, where Playwright 1.55.1 cannot install Chromium.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vacancy_tracker
          POSTGRES_USER: vacancy
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vacancy -d vacancy_tracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the UI into the backend
        run: npm ci && npm run build
        working-directory: frontend
      - name: Package the app
        run: mvn -B -DskipTests package
        working-directory: backend
      - name: Start the app
        run: |
          nohup java -jar backend/target/vacancy-tracker-0.1.0-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/actuator/health && exit 0
            sleep 2
          done
          echo "the app did not start"; cat app.log; exit 1
        env:
          APP_RATES_REFRESH_ON_STARTUP: "false"
          # The scheduled collection (06:00 and 18:00 UTC) must not fire during the browser tests: it pulls the real
          # sources into the Inbox and the dashboard counts stop matching. The header still reads this cron to show the
          # next run, so it must stay a valid one: 29 February, 03:00 UTC, which a test run does not meet.
          APP_COLLECTION_CRON: "0 0 3 29 2 *"
          # The full-cycle browser test uses the fake AI provider: nothing is sent to Claude in CI.
          APP_AI_PROVIDER: fake
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/vacancy_tracker
          SPRING_DATASOURCE_USERNAME: vacancy
          SPRING_DATASOURCE_PASSWORD: ci-only-password
      - name: Install Playwright and its browser
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Audit e2e production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: e2e
      - name: Run the smoke test
        run: npx playwright test
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:8080
      - name: Keep the report and the app log when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure
          path: |
            e2e/playwright-report
            e2e/test-results
            app.log
          retention-days: 7
